version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hazenor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ruko360
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - hazenor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ruko360"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hazenor-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: "HAZENOR Properties"
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ruko360
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hazenor-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      BACKEND_API_URL: http://backend:8000/api/v1
      NEXT_PUBLIC_APP_NAME: "HAZENOR Properties"
    ports:
      - "3000:3000"

volumes:
  hazenor_pgdata:
