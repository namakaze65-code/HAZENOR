<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E384A" />
      <stop offset="100%" stop-color="#0F1C25" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E6CD" />
      <stop offset="50%" stop-color="#C9B58E" />
      <stop offset="100%" stop-color="#9C8354" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Background (Squircle / Rounded Square) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Centered Scaled HAZENOR Monogram (Scale 5.8x, centered at 256, 256) -->
  <g transform="translate(68, 68) scale(5.875)" filter="url(#shadow)">
    <!-- Outer Architectural Hexagonal Frame -->
    <path d="M32 4L56 17.5V46.5L32 60L8 46.5V17.5L32 4Z" stroke="url(#goldGrad)" stroke-width="1.8" stroke-opacity="0.6" fill="none"/>
    
    <!-- Left Outer Pillar -->
    <path d="M14 17L20.5 13.2V50.8L14 47V17Z" fill="url(#goldGrad)"/>
    
    <!-- Left Inner Pillar (Upper) -->
    <path d="M23.5 11.5L29 8.3V28.5L23.5 31.8V11.5Z" fill="url(#goldGrad)"/>
    
    <!-- Right Outer Pillar -->
    <path d="M50 17L43.5 13.2V50.8L50 47V17Z" fill="url(#goldGrad)"/>
    
    <!-- Right Inner Pillar (Upper) -->
    <path d="M40.5 11.5L35 8.3V28.5L40.5 31.8V11.5Z" fill="url(#goldGrad)"/>
    
    <!-- Central Architectural Apex Bridge & Lower Pillars -->
    <path d="M23.5 36.2L32 30.8L40.5 36.2V55.5L35 52.3V39.2L32 37.2L29 39.2V52.3L23.5 55.5V36.2Z" fill="url(#goldGrad)"/>
  </g>
</svg>
